version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: harbin-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: goodluck@123
    volumes:
      - mongodb_data:/data/db
    networks:
      - harbin-network

  redis:
    image: redis:7-alpine
    container_name: harbin-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass goodluck@123
    volumes:
      - redis_data:/data
    networks:
      - harbin-network

  minio:
    image: minio/minio:latest
    container_name: harbin-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - harbin-network

volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  harbin-network:
    driver: bridge
